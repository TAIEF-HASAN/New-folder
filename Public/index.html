<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkini Power Monitor - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script> 
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-50 font-sans pb-10">
    <div class="max-w-2xl mx-auto px-4 mt-8">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">কালকিনি পাওয়ার মনিটর</h1>
            <p class="text-gray-500 mt-1">রিয়েল-টাইম বিদ্যুৎ পর্যবেক্ষণ ব্যবস্থা</p>
        </div>
        <div id="status-card" class="p-8 rounded-2xl shadow-md text-center transition-all duration-500 mb-6">
            <p class="text-sm font-medium uppercase tracking-wider text-gray-500 mb-2">বর্তমানে বিদ্যুৎ অবস্থা:</p>
            <h2 id="current-status" class="text-5xl font-black uppercase tracking-tighter">Loading...</h2>
            <p id="status-time" class="text-sm mt-3 text-gray-600 font-mono italic"></p>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6">
            <h3 class="text-lg font-bold text-gray-700 mb-4 flex items-center italic">📊 লোডশেডিং ট্রেন্ড (শেষ ১০টি ইভেন্ট)</h3>
            <canvas id="powerChart" height="150"></canvas>
        </div>
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 bg-gray-50 border-b border-gray-100 flex justify-between items-center">
                <h3 class="font-bold text-gray-700">📜 সাম্প্রতিক ইতিহাস (Logs)</h3>
                <span class="text-xs text-blue-600 font-semibold bg-blue-50 px-2 py-1 rounded">Live</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="text-xs text-gray-400 uppercase bg-gray-50">
                        <tr>
                            <th class="px-6 py-3">সময়</th>
                            <th class="px-6 py-3">অবস্থা</th>
                            <th class="px-6 py-3">সময়কাল</th>
                        </tr>
                    </thead>
                    <tbody id="log-table-body" class="text-sm divide-y divide-gray-100 text-gray-600"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA4CdIxMmjRyVt1lGMA6uzXbUdg0yu5ln8",
            authDomain: "kalkinipowermonitor.firebaseapp.com",
            databaseURL: "https://kalkinipowermonitor-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kalkinipowermonitor",
            storageBucket: "kalkinipowermonitor.firebasestorage.app",
            messagingSenderId: "119477481190",
            appId: "1:119477481190:web:7f3404fcf0b87db388d527"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const ctx = document.getElementById('powerChart').getContext('2d');
        const powerChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'পাওয়ার স্ট্যাটাস (1=অন, 0=অফ)', data: [], borderColor: '#3b82f6', stepped: true, fill: false }] },
            options: { scales: { y: { min: 0, max: 1.2, ticks: { stepSize: 1 } } } }
        });

        db.ref('current_status').on('value', (snap) => {
            const data = snap.val();
            if (data) {
                document.getElementById('current-status').innerText = data.status;
                document.getElementById('status-time').innerText = `শেষ আপডেট: ${data.time}`;
                document.getElementById('status-card').className = data.status === "Online" ? "p-8 rounded-2xl shadow-md text-center bg-green-50 border-2 border-green-200" : "p-8 rounded-2xl shadow-md text-center bg-red-50 border-2 border-red-200";
                document.getElementById('current-status').className = data.status === "Online" ? "text-5xl font-black text-green-600" : "text-5xl font-black text-red-600";
            }
        });

        // সময়কাল ক্যালকুলেট করার উন্নত ফাংশন
        function calculateDuration(startTimeStr, endTimeStr) {
            if (!startTimeStr || !endTimeStr) return "---";
            const start = new Date(startTimeStr);
            const end = new Date(endTimeStr);
            if (isNaN(start) || isNaN(end)) return "---";
            
            const diffMs = Math.abs(end - start);
            const diffMins = Math.round(diffMs / 60000);
            
            if (diffMins < 1) return "কয়েক সেকেন্ড";
            if (diffMins < 60) return `${diffMins} মিনিট`;
            const hours = Math.floor(diffMins / 60);
            const mins = diffMins % 60;
            return `${hours} ঘণ্টা ${mins} মিনিট`;
        }

        db.ref('power_status').limitToLast(10).on('value', (snap) => {
            const data = snap.val();
            const tableBody = document.getElementById('log-table-body');
            tableBody.innerHTML = '';
            let labels = [], points = [];
            
            if (data) {
                const keys = Object.keys(data); // সময় অনুযায়ী সিরিয়াল কি (Key)
                const items = keys.map(key => data[key]);

                // লুপের ভেতরের অংশ
                for (let i = items.length - 1; i >= 0; i--) {
                    const currentItem = items[i];
                    const previousItem = items[i - 1]; 
                    
                    let duration = "---";

                    // লজিক: যদি বর্তমান স্ট্যাটাস Online হয়, তবেই আগের Offline থেকে সময় হিসেব করবে
                    if (currentItem.status === 'Online' && previousItem && previousItem.status === 'Offline') {
                        duration = calculateDuration(previousItem.time, currentItem.time);
                    }

                    if (currentItem.time && currentItem.status) {
                        const row = `<tr>
                            <td class="px-6 py-4 font-mono text-xs">${currentItem.time}</td>
                            <td class="px-6 py-4">
                                <span class="px-2 py-1 rounded text-xs font-bold ${currentItem.status === 'Online' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                    ${currentItem.status}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-xs font-bold ${currentItem.status === 'Online' ? 'text-red-600' : 'text-gray-400'}">
                                ${currentItem.status === 'Online' ? 'লোডশেডিং: ' + duration : '---'}
                            </td>
                        </tr>`;
                        tableBody.innerHTML += row;
                        
                        labels.unshift(currentItem.time);
                        points.unshift(currentItem.status === 'Online' ? 1 : 0);
                        }
                    }
                    
                    powerChart.data.labels = labels;
                    powerChart.data.datasets[0].data = points;
                    powerChart.update();
                }
        });
    </script>
</body>
</html>
