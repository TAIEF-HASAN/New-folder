<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkini Power Monitor</title>
    <script src="https://tailwindcss.com"></script>
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-xl shadow-md text-center">
        <h1 class="text-2xl font-bold mb-4 text-blue-600">কালকিনি পাওয়ার মনিটর</h1>
        
        <div id="status-card" class="p-6 rounded-lg mb-6">
            <p class="text-lg">বর্তমান অবস্থা:</p>
            <p id="current-status" class="text-3xl font-extrabold uppercase">Loading...</p>
        </div>

        <div class="text-left mt-6">
            <h2 class="font-semibold text-gray-700">শেষ ৫টি আপডেট:</h2>
            <ul id="log-list" class="mt-2 space-y-2 text-sm text-gray-600"></ul>
        </div>
    </div>

    <script>
        // আপনার Firebase Config (Firebase Console > Project Settings এ পাবেন)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_://firebaseapp.com",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_://appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const statusRef = db.ref('power_status');

        // ডেটা রিড করা
        statusRef.limitToLast(5).on('value', (snapshot) => {
            const data = snapshot.val();
            const listElement = document.getElementById('log-list');
            listElement.innerHTML = '';
            
            let lastStatus = "";
            
            Object.keys(data).reverse().forEach((key, index) => {
                const item = data[key];
                if(index === 0) lastStatus = item.status;
                
                const li = document.createElement('li');
                li.innerText = `${item.time}: ${item.status}`;
                listElement.appendChild(li);
            });

            // UI আপডেট
            const statusText = document.getElementById('current-status');
            const card = document.getElementById('status-card');
            
            statusText.innerText = lastStatus;
            if(lastStatus === "Online") {
                statusText.classList.add('text-green-600');
                card.classList.add('bg-green-50');
            } else {
                statusText.classList.add('text-red-600');
                card.classList.add('bg-red-50');
            }
        });
    </script>
</body>
</html>
