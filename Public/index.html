<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkini Power Monitor</title>
    <!-- Tailwind CSS (সঠিক লিঙ্ক) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK (অবশ্যই এই লিঙ্কগুলো দিতে হবে) -->
    <script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-database-compat.js"></script>
</head>


<body class="bg-gray-100 font-sans">
    <div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-xl shadow-md text-center">
        <h1 class="text-2xl font-bold mb-4 text-blue-600">কালকিনি পাওয়ার মনিটর</h1>
        
        <div id="status-card" class="p-6 rounded-lg mb-6">
            <p class="text-lg">বর্তমান অবস্থা:</p>
            <p id="current-status" class="text-3xl font-extrabold uppercase">Loading...</p>
        </div>

        <div class="text-left mt-6">
            <h2 class="font-semibold text-gray-700">শেষ ৫টি আপডেট:</h2>
            <ul id="log-list" class="mt-2 space-y-2 text-sm text-gray-600"></ul>
        </div>
    </div>

    <script>
        // আপনার Firebase Config (Firebase Console > Project Settings এ পাবেন)
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
        apiKey: "AIzaSyA4CdIxMmjRyVt1lGMA6uzXbUdg0yu5ln8",
        authDomain: "kalkinipowermonitor.firebaseapp.com",
        databaseURL: "https://kalkinipowermonitor-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "kalkinipowermonitor",
        storageBucket: "kalkinipowermonitor.firebasestorage.app",
        messagingSenderId: "119477481190",
        appId: "1:119477481190:web:7f3404fcf0b87db388d527",
        measurementId: "G-YDZDHPFW6C"
        };

         // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const statusRef = db.ref('power_status');

        // ডেটা রিড করা
        statusRef.limitToLast(5).on('value', (snapshot) => {
            const data = snapshot.val();
            const listElement = document.getElementById('log-list');
            listElement.innerHTML = '';
            
            let lastStatus = "";
            
            Object.keys(data).reverse().forEach((key, index) => {
                const item = data[key];
                if(index === 0) lastStatus = item.status;
                
                const li = document.createElement('li');
                li.innerText = `${item.time}: ${item.status}`;
                listElement.appendChild(li);
            });

            // UI আপডেট
            const statusText = document.getElementById('current-status');
            const card = document.getElementById('status-card');
            
            statusText.innerText = lastStatus;
            if(lastStatus === "Online") {
                statusText.classList.add('text-green-600');
                card.classList.add('bg-green-50');
            } else {
                statusText.classList.add('text-red-600');
                card.classList.add('bg-red-50');
            }
        });
    </script>
</body>
</html>
