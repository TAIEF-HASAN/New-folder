<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPM - Admin Panel</title>
    
    <!-- 🟢 Tailwind CSS CDN (সঠিক লিঙ্ক) -->
    <script src="https://cdn.tailwindcss.com"></script>
     
    <!-- Firebase SDK (নিখুঁত আছে) -->
    <script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-database-compat.js"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center font-sans">

    <!-- 🔒 1. Login Section (পাসওয়ার্ড গেট) -->
    <div id="login-section" class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-amber-500 mb-2">⚡ KPM Admin</h1>
            <p class="text-slate-400 text-sm">জরুরি নোটিশ বোর্ড আপডেট প্যানেল</p>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">অ্যাডমিন পাসওয়ার্ড</label>
                <input type="password" id="admin-password" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition" placeholder="••••••••">
            </div>
            <p id="login-error" class="text-red-500 text-sm hidden">❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।</p>
            <button onclick="verifyPassword()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-amber-500/20">লগইন করুন</button>
        </div>
    </div>

    <!-- 📝 2. Control Panel Section (লগইন সফল হলে এটি দেখাবে) -->
    <div id="panel-section" class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-lg border border-slate-700 hidden">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-amber-500">📢 Notice Control</h1>
                <p class="text-slate-400 text-xs">সরাসরি ড্যাশবোর্ডে নোটিশ পাবলিশ করুন</p>
            </div>
            <button onclick="logout()" class="text-xs bg-slate-700 hover:bg-red-600 px-3 py-1.5 rounded-lg transition">লগআউট</button>
        </div>

        <div class="space-y-5">
            <!-- নোটিশের স্ট্যাটাস টগল -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">নোটিশ বোর্ড স্ট্যাটাস</label>
                <select id="notice-status" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition">
                    <option value="Active">🔴 Active (ড্যাশবোর্ডে দেখাবে)</option>
                    <option value="Inactive">⚪ Inactive (বন্ধ থাকবে)</option>
                </select>
            </div>

            <!-- নোটিশ টেক্সট এরিয়া -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">জরুরি নোটিশের বিবরণ</label>
                <textarea id="notice-text" rows="4" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition" placeholder="এখানে নোটিশের লেখাটি লিখুন..."></textarea>
            </div>

            <!-- সাকসেস/এরর মেসেজ -->
            <p id="action-status" class="text-sm font-semibold text-center hidden"></p>

            <!-- সাবমিট বাটন -->
            <button onclick="publishNotice()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-500/20">🚀 Publish Notice</button>
        </div>
    </div>

    <!-- 🔒 সিকিউর অ্যাডমিন কন্ট্রোল প্যানেল -->
    <div id="admin-master-hub" class="p-6 bg-white rounded-3xl shadow-xl max-w-lg mx-auto mt-6 hidden">
        <h2 class="text-xl font-black text-gray-800 mb-6 flex items-center gap-2">⚙️ KPM সেন্ট্রাল কন্ট্রোল প্যানেল</h2>
        
        <!-- সেকশন এ: নতুন এলাকা যুক্ত করুন (যা গ্রাহকের ২-কলাম UI তে অটো যাবে) -->
        <div class="border-b border-gray-100 pb-6 mb-6">
            <h3 class="text-sm font-black text-blue-600 uppercase tracking-wider mb-3">📍 নতুন এলাকা তৈরি করুন</h3>
            <div class="space-y-3">
                <input type="text" id="new-area-name" placeholder="এলাকার নাম লিখুন (উদা: সাহেবরামপুর)" class="w-full p-3 border border-gray-200 bg-gray-50 rounded-xl font-bold text-gray-700 outline-none focus:border-blue-500">
                <input type="text" id="new-area-feeder" placeholder="ফিডার আইডি লিখুন (উদা: feeder_sahebrampur)" class="w-full p-3 border border-gray-200 bg-gray-50 rounded-xl font-bold text-gray-700 outline-none focus:border-blue-500">
                <button onclick="createNewAreaViaUI()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-all active:scale-95">এলাকা লাইভ করুন 🚀</button>
            </div>
        </div>

        <!-- সেকশন বি: এলাকার ভেতর সাব-নোড যুক্ত করুন (যা শুধু অ্যাডমিন প্যানেলে থাকবে) -->
        <div>
            <h3 class="text-sm font-black text-rose-600 uppercase tracking-wider mb-3">🛠️ এলাকার ভেতর ফল্ট সাব-নোড যুক্ত করুন</h3>
            <div class="space-y-3">
                <select id="admin-area-dropdown" class="w-full p-3 border border-gray-200 bg-gray-50 rounded-xl font-bold text-gray-700 outline-none focus:border-rose-500">
                    <!-- ডাইনামিকালি মেইন এলাকাগুলো এখানে লোড হবে -->
                </select>
                <input type="text" id="new-subnode-name" placeholder="সাব-নোডের স্থান (উদা: খাসেরহাট স্কুল রোড ২.১)" class="w-full p-3 border border-gray-200 bg-gray-50 rounded-xl font-bold text-gray-700 outline-none focus:border-rose-500">
                <input type="number" id="new-subnode-seq" placeholder="সিকুয়েন্স ক্রম (উদা: 1, 2, 3)" class="w-full p-3 border border-gray-200 bg-gray-50 rounded-xl font-bold text-gray-700 outline-none focus:border-rose-500">
                <button onclick="addNewSubNodeViaUI()" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-md transition-all active:scale-95">ফল্ট নোড যুক্ত করুন 🎯</button>
            </div>
        </div>
    </div>


    <script>
        // 🔒 আপনার মেইন index.html থেকে Firebase Config হুবহু কপি করে এখানে বসান
        const firebaseConfig = {
                apiKey: "AIzaSyA4CdIxMmjRyVt1lGMA6uzXbUdg0yu5ln8",
                authDomain: "kalkinipowermonitor.firebaseapp.com",
                databaseURL: "https://kalkinipowermonitor-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "kalkinipowermonitor",
                storageBucket: "kalkinipowermonitor.firebasestorage.app",
                messagingSenderId: "119477481190",
                appId: "1:119477481190:web:7f3404fcf0b87db388d527"
            };
        
        // ফায়ারবেস ইনিশিয়ালাইজেশন
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 🤫 আপনার সিক্রেট অ্যাডমিন পাসওয়ার্ড (এটি আপনার ইচ্ছামতো পরিবর্তন করতে পারেন)
        const SECRET_PASSWORD = "kalkini_power_admin";

        // পাসওয়ার্ড ভেরিফিকেশন ফাংশন
        function verifyPassword() {
            const input = document.getElementById('admin-password').value;
            const errorMsg = document.getElementById('login-error');
            
            if (input === SECRET_PASSWORD) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('panel-section').classList.remove('hidden');
                errorMsg.classList.add('hidden');
                loadCurrentNotice(); // বর্তমান নোটিশ লোড করা
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        // ডেটাবেজ থেকে বর্তমান নোটিশ এনে বক্সে দেখানো
        function loadCurrentNotice() {
            db.ref('emergency_notice').once('value', (snap) => {
                const data = snap.val();
                if (data) {
                    document.getElementById('notice-status').value = data.status || 'Inactive';
                    document.getElementById('notice-text').value = data.text || '';
                }
            });
        }

        // ফায়ারবেসে নোটিশ পাবলিশ করার ফাংশন
        function publishNotice() {
            const status = document.getElementById('notice-status').value;
            const text = document.getElementById('notice-text').value.trim();
            const statusLabel = document.getElementById('action-status');

            if (!text && status === 'Active') {
                statusLabel.className = "text-red-400 text-sm font-semibold text-center";
                statusLabel.innerText = "⚠️ দয়া করে নোটিশের বিবরণ লিখুন!";
                statusLabel.classList.remove('hidden');
                return;
            }

            // ফায়ারবেসে ডেটা পুশ লজিক
            db.ref('emergency_notice').set({
                status: status,
                text: text,
                timestamp: new Date().toLocaleString("en-US", {timeZone: "Asia/Dhaka"})
            })
            .then(() => {
                statusLabel.className = "text-emerald-400 text-sm font-semibold text-center";
                statusLabel.innerText = "✅ নোটিশ সফলভাবে ড্যাশবোর্ডে লাইভ হয়েছে!";
                statusLabel.classList.remove('hidden');
                setTimeout(() => statusLabel.classList.add('hidden'), 3000);
            })
            .catch((err) => {
                statusLabel.className = "text-red-400 text-sm font-semibold text-center";
                statusLabel.innerText = "❌ এরর: " + err.message;
                statusLabel.classList.remove('hidden');
            });
        }

        // লগআউট ফাংশন
        function logout() {
            document.getElementById('admin-password').value = '';
            document.getElementById('panel-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }

        // ১. অ্যাডমিন ড্রপডাউনে মেইন এলাকাগুলো ফায়ারবেস থেকে স্বয়ংক্রিয়ভাবে লোড করা
        db.ref('kalkini_power_monitor/areas').on('value', (snapshot) => {
            const areas = snapshot.val();
            const areaDropdown = document.getElementById('admin-area-dropdown');
            if (!areaDropdown || !areas) return;

            areaDropdown.innerHTML = ''; // আগের অপশন পরিষ্কার করা
            Object.keys(areas).forEach((areaId) => {
                areaDropdown.innerHTML += `<option value="${areaId}">${areas[areaId].name}</option>`;
            });
        });

        // ২. UI থেকে সরাসরি নতুন মেইন এলাকা তৈরি করা (যা গ্রাহকের ২-কলাম কার্ডে অটো যোগ হবে)
        function createNewAreaViaUI() {
            const areaName = document.getElementById('new-area-name').value.trim();
            const feederId = document.getElementById('new-area-feeder').value.trim();

            if (!areaName || !feederId) {
                alert("দয়া করে এলাকার নাম এবং ফিডার আইডি দুটোই পূরণ করুন!");
                return;
            }

            // একটি ইউনিক এরিয়া আইডি জেনারেট করা
            const customAreaId = `area_${Date.now().toString().slice(-4)}`;

            db.ref(`kalkini_power_monitor/areas/${customAreaId}`).set({
                name: areaName,
                feeder_id: feederId,
                status: "Online", // নতুন এলাকা ডিফল্টভাবে অনলাইন থাকবে
                last_ping: new Date().toLocaleString()
            }).then(() => {
                alert(`🎉 সফলভাবে মেইন এলাকা "${areaName}" যুক্ত হয়েছে! এটি এখন গ্রাহকদের ২-কলাম স্ক্রিনে লাইভ।`);
                document.getElementById('new-area-name').value = '';
                document.getElementById('new-area-feeder').value = '';
            }).catch(err => alert("সার্ভার ত্রুটি, আবার চেষ্টা করুন।"));
        }

        // ৩. মেইন এলাকার ভেতরে সাব-নোড (২.১, ২.২) যুক্ত করা (যা শুধু বিদ্যুৎ অফিসের ফল্ট ট্র্যাকিংয়ে দেখাবে)
        function addNewSubNodeViaUI() {
            const selectedAreaId = document.getElementById('admin-area-dropdown').value;
            const subNodeName = document.getElementById('new-subnode-name').value.trim();
            const subNodeSeq = parseInt(document.getElementById('new-subnode-seq').value);

            if (!subNodeName || isNaN(subNodeSeq)) {
                alert("দয়া করে সাব-নোডের নাম এবং সঠিক ক্রম নম্বরটি লিখুন!");
                return;
            }

            const newNodeId = `node_${subNodeSeq}_${Date.now().toString().slice(-3)}`;

            // ফায়ারবেসের নির্দিষ্ট এরিয়ার ভেতরে 'nodes' সাব-কালেকশনে ডেটা রাইট করা
            db.ref(`kalkini_power_monitor/areas/${selectedAreaId}/nodes/${newNodeId}`).set({
                name: subNodeName,
                status: "Online",
                sequence: subNodeSeq,
                last_ping: new Date().toLocaleString()
            }).then(() => {
                alert(`🎯 সফলভাবে ফল্ট সাব-নোড "${subNodeName}" যুক্ত হয়েছে! এটি শুধু অ্যাডমিন প্যানেলে দৃশ্যমান হবে।`);
                document.getElementById('new-subnode-name').value = '';
                document.getElementById('new-subnode-seq').value = '';
            }).catch(err => alert("সার্ভার ত্রুটি, আবার চেষ্টা করুন।"));
        }

    </script>
</body>
</html>
